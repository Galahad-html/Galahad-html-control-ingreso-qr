services:
  db:
    image: mysql:8.0
    container_name: ingreso_db
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ}
    command: --default-time-zone=-05:00 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 15
  web:
    build: ./web
    container_name: ingreso_web
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${WEB_PORT}:3000"
    volumes:
      - ./web/src:/app/src
    depends_on:
      db:
        condition: service_healthy
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ingreso_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: